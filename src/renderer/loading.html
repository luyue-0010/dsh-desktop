<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'" />
    <title>DeepSeek Harness</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #f9fafb;
        --fg: #111827;
        --muted: #6b7280;
        --accent: #4d6bfe;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #16181d;
          --fg: #ecedf1;
          --muted: #9aa1ad;
        }
      }
      html,
      body {
        height: 100%;
        margin: 0;
      }
      body {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 18px;
        background: var(--bg);
        color: var(--fg);
        font-family: -apple-system, "Segoe UI", "Microsoft YaHei", Roboto, sans-serif;
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 10px;
        font-size: 22px;
        font-weight: 600;
        letter-spacing: 0.02em;
      }
      .dot {
        width: 10px;
        height: 10px;
        border-radius: 50%;
        background: var(--accent);
        animation: pulse 1.2s ease-in-out infinite;
      }
      @keyframes pulse {
        0%,
        100% {
          opacity: 0.35;
          transform: scale(0.85);
        }
        50% {
          opacity: 1;
          transform: scale(1.1);
        }
      }
      #message {
        color: var(--muted);
        font-size: 13px;
        min-height: 18px;
      }
    </style>
  </head>
  <body>
    <div class="brand"><span class="dot"></span>DeepSeek Harness</div>
    <div id="message">正在准备桌面端…</div>
    <script>
      const target = document.getElementById('message')
      const describe = (status) => {
        if (!status) return '正在准备桌面端…'
        if (status.phase === 'starting') return '正在启动本地 dsh web 服务…'
        if (status.phase === 'running') return `已就绪：${status.url || ''}`
        if (status.phase === 'failed') return status.message || '启动失败'
        return '正在准备桌面端…'
      }
      if (window.dshDesktop) {
        window.dshDesktop.getStatus().then((status) => {
          target.textContent = describe(status)
        })
        window.dshDesktop.onStatus((status) => {
          target.textContent = describe(status)
        })
      }
    </script>
  </body>
</html>
